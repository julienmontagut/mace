name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        rust: [stable]

    steps:
    - uses: actions/checkout@v4
    
    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        toolchain: ${{ matrix.rust }}
    
    - name: Build
      run: cargo build --verbose
    
    - name: Run tests
      run: cargo test --verbose

  publish:
    name: Tag and Publish
    needs: [test]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Check version change
      id: check_version
      run: |
        # Get the current version from Cargo.toml
        CURRENT_VERSION=$(cargo pkgid | cut -d# -f2 | cut -d: -f2)
        echo "Current version: $CURRENT_VERSION"
        
        # Check if tag already exists
        if git rev-parse "v$CURRENT_VERSION" >/dev/null 2>&1; then
          echo "Version $CURRENT_VERSION already tagged, skipping publish"
          echo "should_publish=false" >> $GITHUB_OUTPUT
        else
          echo "New version detected: $CURRENT_VERSION"
          echo "should_publish=true" >> $GITHUB_OUTPUT
          echo "version=$CURRENT_VERSION" >> $GITHUB_OUTPUT
        fi

    - name: Create and push tag
      if: steps.check_version.outputs.should_publish == 'true'
      run: |
        git config user.name "Julien Montagut"
        git config user.email "_@julienmontagut.com"
        git tag -a "v${{ steps.check_version.outputs.version }}" -m "Release v${{ steps.check_version.outputs.version }}"
        git push origin "v${{ steps.check_version.outputs.version }}"
    
    - name: Publish to crates.io
      if: steps.check_version.outputs.should_publish == 'true'
      run: cargo publish
      env:
        CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }} 